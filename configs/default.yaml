# GP 因子挖掘默认配置

gp:
  population_size: 500
  generations: 50
  tournament_size: 5
  crossover_prob: 0.7
  mutation_prob: 0.2
  max_depth: 6
  min_depth: 2
  strongly_typed: true
  n_jobs: 10

rl:                    # 强化学习挖因子（train_rl.py），命令行可覆盖
  iters: 300
  batch: 64
  lr: 0.001
  entropy: 0.01        # 熵奖励系数，防早熟
  parsimony: 0.001     # 简约惩罚：奖励=|IC|−parsimony·树大小，罚 bloat 过拟合
  max_len: 10          # 表达式最大 token 数，硬卡树大小（原 20 太容易 bloat）
  train_start: "2021-01-01"  # 训练段限在 2021+ regime 内（regime 断点教训）
  train_end: "2023-01-01"
  topk: 0              # 落盘因子数上限；0=全部探索到的都存
  n_jobs: 10           # 落盘补算 test_ic 的并行核数

data:
  start_date: "2018-01-01"
  end_date: "2023-12-31"
  universe: "hs300"  # 沪深300成分股

evaluation:
  ic_method: "rank"  # rank IC (Spearman)
  n_groups: 5        # 分组回测的组数
  parsimony: 0.002 # 简约惩罚系数

backtest:
  holding_period: 5  # 持仓天数
  commission: 0.001  # 手续费率
