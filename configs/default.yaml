# GP 因子挖掘默认配置

gp:
  population_size: 500
  generations: 50
  tournament_size: 5
  crossover_prob: 0.7
  mutation_prob: 0.2
  max_depth: 6
  min_depth: 2

data:
  start_date: "2018-01-01"
  end_date: "2023-12-31"
  universe: "hs300"  # 沪深300成分股

evaluation:
  ic_method: "rank"  # rank IC (Spearman)
  n_groups: 5        # 分组回测的组数

backtest:
  holding_period: 5  # 持仓天数
  commission: 0.001  # 手续费率
