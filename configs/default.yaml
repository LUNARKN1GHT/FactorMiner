# GP 因子挖掘默认配置

gp:
  population_size: 500
  generations: 50
  tournament_size: 5
  crossover_prob: 0.7
  mutation_prob: 0.2
  max_depth: 6
  min_depth: 2
  strongly_typed: true
  n_jobs: 10

rl: # 强化学习挖因子（train_rl.py），命令行可覆盖
  seed: 42 # 固定种子保可复现（baseline 必须）
  iters: 300
  batch: 64
  lr: 0.001
  entropy: 0.01 # 熵奖励系数，防早熟
  parsimony: 0.001 # 简约惩罚：奖励=|IC|−parsimony·树大小，罚 bloat 过拟合
  max_len: 10 # 表达式最大 token 数，硬卡树大小（原 20 太容易 bloat）
  train_start: "2021-01-01" # 训练段限在 2021+ regime 内（regime 断点教训）
  train_end: "2023-01-01"
  topk: 0 # 落盘因子数上限；0=全部探索到的都存
  n_jobs: 10 # 落盘补算 test_ic 的并行核数

quantfactor: # QuantFactor REINFORCE 复现（run_quantfactor.py），贪婪基线+因子池+IR塑形
  seed: 42
  iters: 300
  batch: 32 # 每轮采样轨迹数；每条还配一条贪婪轨迹，实际 rollout = 2×batch
  lr: 0.001
  entropy: 0.01 # 熵奖励系数，防早熟
  max_len: 10 # 表达式最大 token 数，跟 rl: 段一致
  pool_capacity: 10 # 因子池容量，超出淘汰 |weight| 最小项
  pool_lr: 0.05 # 池子线性组合权重的梯度下降学习率
  pool_gd_steps: 200 # 每次候选入池后重新拟合的梯度下降步数
  ir_alpha: 180000 # IR 阈值时变调度：threshold = clip[(step-ir_alpha)*ir_eta, 0, ir_delta]
  ir_eta: 0.000001
  ir_delta: 0.3
  ir_lambda: 0.02 # 组合 IR 低于阈值时的奖励惩罚幅度
  train_start: "2021-01-01" # 训练段限在 2021+ regime 内，跟 rl:/llm: 一致
  train_end: "2023-01-01"
  topk: 0 # 落盘因子数上限；0=全部探索到的都存
  n_jobs: 10 # 落盘补算 test_ic 的并行核数

data:
  start_date: "2018-01-01"
  end_date: "2023-12-31"
  universe: "hs300" # 沪深300成分股

evaluation:
  ic_method: "rank" # rank IC (Spearman)
  n_groups: 5 # 分组回测的组数
  parsimony: 0.002 # 简约惩罚系数

backtest:
  holding_period: 5 # 持仓天数
  commission: 0.001 # 手续费率

llm: # LLM 进化挖掘因子
  model_a: "deepseek-v4-pro" # 操作员：生成 / 进化
  model_b: "deepseek-v4-pro" # 评论家：诊断因子
  rounds: 10 # 最大进化轮数
  n_per_round: 50 # 每轮让 A 提多少因子
  patience: 3 # 连续无提升轮数 -> 早停
  critic_every: 1 # B 调用频率：1=每轮；设大可省钱（只在该频率轮调 B）
  temperature: 1.0
  max_operators: 10 # 清洗：算子数上限，防 bloat
  parsimony: 0.001 # train_score=|train_ic|−parsimony·size，沿用 RL
  archive_size: 10 # 回灌给 A 的精英范例数
  train_start: "2021-01-01" # 训练段限在 2021+ regime 内
  train_end: "2023-01-01" # 留 2023 全年做 OOS test（同 rl: 段，别占满到年底）
  topk: 0 # 落盘上限，0 = 全存
  n_jobs: 10
  price_in: 0.025 # 每百万 input token 单价（估算金额用，按实际计费填）
  price_out: 6.0 # 每百万 output token 单价
