# 小规模冒烟：服务器首次跑通用
gp:
  population_size: 50
  generations: 10
  tournament_size: 5
  crossover_prob: 0.7
  mutation_prob: 0.2
  max_depth: 5
  min_depth: 2

data:
  clean_path: "data/cache/prices_clean.parquet"

evaluation:
  ic_method: "rank"
  n_groups: 5

backtest:
  holding_period: 5
  commission: 0.001
