# 小规模冒烟：服务器首次跑通用
gp:
  population_size: 50
  generations: 10
  tournament_size: 5
  crossover_prob: 0.7
  mutation_prob: 0.2
  max_depth: 5
  min_depth: 2
  strongly_typed: true
  n_jobs: 10

rl:                    # 强化学习挖因子·冒烟（小批跑通用）
  seed: 42
  iters: 20
  batch: 16
  lr: 0.001
  entropy: 0.01
  parsimony: 0.001     # 简约惩罚，罚 bloat
  max_len: 10          # 硬卡树大小
  train_start: "2021-01-01"
  train_end: "2023-01-01"
  topk: 0
  n_jobs: 10

data:
  clean_path: "data/cache/prices_clean.parquet"

evaluation:
  ic_method: "rank"
  n_groups: 5

backtest:
  holding_period: 5
  commission: 0.001
